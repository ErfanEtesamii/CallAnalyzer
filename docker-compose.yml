services:
  backend:
    build: {context: ., dockerfile: backend/Dockerfile, args: {WITH_WHISPER: "${WITH_WHISPER:-0}"}}
    env_file: backend/.env
    volumes: ["./data:/app/backend/data"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["443:443", "80:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
    depends_on: [backend]
    restart: unless-stopped
volumes: {caddy_data: {}}
